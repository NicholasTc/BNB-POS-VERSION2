<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LISI Kasir – Penyiapan perangkat</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #efede7; --card: #fff; --ink: #1b1917; --ink-2: #5b5650; --ink-3: #a09a91;
    --line: #e4e1da; --brand: #1d5a42; --brand-2: #2f7d5d; --brand-ink: #fff; --brand-soft: #e6f1ea;
    --warn: #a85b07; --warn-soft: #fdf1dc; --err: #b42318; --err-soft: #fdecea;
    --r: 14px; --ease: cubic-bezier(.2,.8,.2,1);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121110; --panel: #181614; --card: #1d1b19; --ink: #f4f2ee; --ink-2: #b4aea5; --ink-3: #6c675f;
      --line: #2d2a27; --brand: #55ab85; --brand-2: #7cc7a2; --brand-ink: #0c1a13; --brand-soft: #172a21;
      --warn: #f2b25e; --warn-soft: #2a2012; --err: #f28b82; --err-soft: #2d1614; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .app { min-height: 100%; display: grid; grid-template-columns: minmax(280px, 38%) 1fr; }
  @media (max-width: 820px) { .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; } }

  /* Left rail */
  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 32px 40px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .03em; }
  .logo { width: 32px; height: 32px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-size: 16px; }
  .rail-body { margin: auto 0; padding: 40px 0; }
  .rail-title { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 0 0 20px; font-weight: 600; }
  .steps { list-style: none; margin: 0; padding: 0; position: relative; }
  .steps li { display: grid; grid-template-columns: 32px 1fr; gap: 14px; padding-bottom: 28px; position: relative; }
  .steps li:last-child { padding-bottom: 0; }
  .steps li::before { content: ""; position: absolute; left: 15px; top: 32px; bottom: 0; width: 2px; background: var(--line); }
  .steps li:last-child::before { display: none; }
  .steps li.done::before { background: var(--brand); }
  .dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: var(--ink-3); transition: all .3s var(--ease); z-index: 1; }
  .steps .now .dot { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 5px var(--brand-soft); }
  .steps .done .dot { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .steps .t { font-weight: 600; font-size: 15px; padding-top: 5px; color: var(--ink-3); }
  .steps .d { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  .steps .now .t, .steps .done .t { color: var(--ink); }
  .steps .now .d { color: var(--ink-2); }
  .rail-foot { font-size: 13px; color: var(--ink-3); }
  @media (max-width: 820px) {
    aside { padding: 16px 20px; border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; align-items: center; justify-content: space-between; }
    .rail-body, .rail-foot { display: none; }
    .mini { display: flex !important; }
  }
  .mini { display: none; gap: 6px; align-items: center; font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .mini i { width: 22px; height: 6px; border-radius: 3px; background: var(--line); transition: background .3s; }
  .mini i.on { background: var(--brand); }

  /* Stage */
  main { display: grid; place-items: center; padding: 32px 20px; }
  .stage { width: 100%; max-width: 420px; }
  .view { animation: in .35s var(--ease); }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.ok { background: var(--brand-soft); color: var(--brand); }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .chip.live i { animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  h1 { font-size: clamp(26px, 4vw, 32px); line-height: 1.15; letter-spacing: -.025em; margin: 18px 0 10px; font-weight: 700; }
  .sub { color: var(--ink-2); font-size: 16px; line-height: 1.55; margin: 0 0 28px; }

  .btn { font: inherit; font-weight: 600; font-size: 17px; width: 100%; min-height: 56px; border-radius: var(--r); border: 1px solid transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .08s, filter .15s, background .15s; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn:active { transform: scale(.985); }
  .btn[disabled] { opacity: .65; cursor: progress; }
  .link { background: none; border: 0; font: inherit; font-size: 15px; color: var(--ink-2); cursor: pointer; padding: 12px 8px; border-radius: 10px; }
  .link:hover { color: var(--ink); background: var(--panel); }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 50%, transparent); outline-offset: 2px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }

  details { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 16px; }
  summary { cursor: pointer; font-size: 15px; color: var(--ink-2); list-style: none; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "＋"; color: var(--ink-3); }
  details[open] summary::after { content: "−"; }
  details p { color: var(--ink-2); font-size: 15px; line-height: 1.55; margin: 12px 0 0; background: var(--panel); padding: 14px 16px; border-radius: 12px; }

  /* Form */
  label { display: block; font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  .field { margin-bottom: 18px; }
  input[type=email], input[type=password], input[type=text] { width: 100%; font: inherit; font-size: 16px; padding: 15px 16px; border-radius: var(--r);
    border: 1.5px solid var(--line); background: var(--card); color: var(--ink); transition: border-color .15s, box-shadow .15s; }
  input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  .hint { font-size: 13px; color: var(--ink-3); margin-top: 6px; }
  .error { background: var(--err-soft); color: var(--err); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 16px; }
  .back { background: none; border: 0; font: inherit; color: var(--ink-2); cursor: pointer; padding: 6px 0; margin-bottom: 12px; font-size: 14px; }
  .back:hover { color: var(--ink); }

  .device { display: flex; gap: 14px; align-items: center; padding: 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); margin-bottom: 20px; }
  .device svg { width: 36px; height: 36px; color: var(--brand); flex: none; }
  .device b { display: block; font-size: 15px; } .device span { font-size: 13px; color: var(--ink-2); }

  /* Success */
  .check { width: 76px; height: 76px; border-radius: 50%; background: var(--brand-soft); display: grid; place-items: center; margin-bottom: 8px; }
  .check svg { width: 38px; height: 38px; stroke: var(--brand); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: draw .5s .15s var(--ease) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 24px; }
  .bar i { display: block; height: 100%; background: var(--brand); width: 0; animation: fill 2.2s linear forwards; }
  @keyframes fill { to { width: 100%; } }

  /* PIN */
  .center { text-align: center; }
  .pins { display: flex; justify-content: center; gap: 16px; margin: 4px 0 24px; }
  .pins span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink-3); transition: all .15s var(--ease); }
  .pins span.on { background: var(--ink); border-color: var(--ink); transform: scale(1.1); }
  .pins.err { animation: shake .35s; } .pins.err span { background: var(--err); border-color: var(--err); }
  @keyframes shake { 20%,60% { transform: translateX(-7px); } 40%,80% { transform: translateX(7px); } }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .key { font: inherit; font-size: 24px; font-weight: 500; height: 64px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); color: var(--ink); cursor: pointer; transition: background .1s, transform .06s; }
  .key:hover { background: var(--panel); } .key:active { transform: scale(.96); background: var(--brand-soft); }
  .key.fn { background: transparent; border-color: transparent; font-size: 14px; color: var(--ink-2); }
  .status { min-height: 22px; text-align: center; margin: 16px 0 0; font-size: 14px; color: var(--err); }
  .status.ok { color: var(--brand); font-weight: 600; }

  .demo { position: fixed; right: 16px; bottom: 16px; font-size: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--ink-3); display: flex; gap: 10px; align-items: center; }
  .demo button { font: inherit; font-size: 12px; border: 0; background: var(--panel); color: var(--ink-2); padding: 5px 10px; border-radius: 7px; cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="logo">L</span>LISI Kasir</div>
    <div class="rail-body">
      <p class="rail-title">Persiapan perangkat</p>
      <ol class="steps" id="steps"></ol>
    </div>
    <div class="rail-foot">Penyiapan hanya sekali per perangkat.</div>
    <div class="mini" id="mini"></div>
  </aside>
  <main><div class="stage" id="stage" aria-live="polite"></div></main>
</div>
<div class="demo">Demo UI (tidak terhubung ke aplikasi) <button id="reset">Ulangi</button></div>

<script>
const STEPS = [
  ["Masuk sebagai pemilik", "Verifikasi bahwa ini Anda"],
  ["Hubungkan perangkat", "Satu klik untuk mengizinkan"],
  ["Kasir siap dipakai", "Karyawan masuk dengan PIN"]
];
// views: start | login | confirm | done | pin
let view = "start", pin = "", status = "", ok = false, err = false, loginErr = "", busy = false, timer;
const $ = id => document.getElementById(id);
const stepIndex = { start: 0, login: 0, confirm: 1, done: 2, pin: 3 };

function rail() {
  const cur = stepIndex[view];
  $("steps").innerHTML = STEPS.map((s, i) => {
    const cls = i < cur ? "done" : i === cur ? "now" : "";
    return `<li class="${cls}"><span class="dot">${i < cur ? "✓" : i + 1}</span><div><div class="t">${s[0]}</div><div class="d">${s[1]}</div></div></li>`;
  }).join("");
  $("mini").innerHTML = STEPS.map((_, i) => `<i class="${i <= Math.min(cur, 2) ? "on" : ""}"></i>`).join("") + `<span>&nbsp;Langkah ${Math.min(cur + 1, 3)} dari 3</span>`;
}

const V = {
  start: () => `
    <div class="view">
      <span class="chip warn live"><i></i>Perangkat belum terhubung</span>
      <h1>Mari siapkan kasir di perangkat ini</h1>
      <p class="sub">Sebagai pemilik, Anda hanya perlu melakukannya satu kali. Setelah itu karyawan bisa langsung masuk dengan PIN.</p>
      <button class="btn primary" data-a="to-login">Mulai penyiapan <span aria-hidden="true">→</span></button>
      <details>
        <summary>Saya karyawan</summary>
        <p>Perangkat ini belum disiapkan. Mintalah pemilik menyelesaikan penyiapan — halaman ini akan otomatis berubah ke layar PIN begitu selesai.</p>
      </details>
    </div>`,
  login: () => `
    <div class="view">
      <button class="back" data-a="to-start">← Kembali</button>
      <h1>Masuk sebagai pemilik</h1>
      <p class="sub">Gunakan akun pemilik LISI Anda.</p>
      ${loginErr ? `<div class="error" role="alert">${loginErr}</div>` : ""}
      <form id="loginForm" novalidate>
        <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="username" placeholder="nama@kafe.com" required></div>
        <div class="field"><label for="pw">Kata sandi</label><input id="pw" type="password" autocomplete="current-password" required></div>
        <button class="btn primary" ${busy ? "disabled" : ""}>${busy ? "Memeriksa…" : "Lanjut"}</button>
      </form>
    </div>`,
  confirm: () => `
    <div class="view">
      <span class="chip ok"><i></i>Masuk sebagai pemilik</span>
      <h1>Hubungkan browser ini?</h1>
      <p class="sub">Perangkat ini akan menjadi kasir resmi kafe Anda. Anda bisa memutuskannya kapan saja dari pengaturan.</p>
      <div class="device">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <div><b>Perangkat ini</b><span>Browser yang sedang Anda pakai</span></div>
      </div>
      <button class="btn primary" data-a="link" ${busy ? "disabled" : ""}>${busy ? "Menghubungkan…" : "Ya, hubungkan perangkat ini"}</button>
      <div class="row"><button class="link" data-a="to-start">Batal</button></div>
    </div>`,
  done: () => `
    <div class="view center">
      <div class="check" style="margin-inline:auto"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>Perangkat terhubung</h1>
      <p class="sub" style="margin-bottom:0">Kasir siap dipakai. Menyiapkan layar PIN…</p>
      <div class="bar"><i></i></div>
    </div>`,
  pin: () => `
    <div class="view center">
      <span class="chip ok"><i></i>Perangkat terhubung</span>
      <h1>Masukkan PIN Anda</h1>
      <p class="sub" style="margin-bottom:24px">4 angka untuk mulai bekerja atau berganti kasir.</p>
      <div class="pins ${err ? "err" : ""}" role="img" aria-label="${pin.length} dari 4 angka">${[0,1,2,3].map(i => `<span class="${i < pin.length ? "on" : ""}"></span>`).join("")}</div>
      <div class="pad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="key" data-k="${n}" aria-label="${n}">${n}</button>`).join("")}
        <button class="key fn" data-k="clear">Hapus</button>
        <button class="key" data-k="0" aria-label="0">0</button>
        <button class="key fn" data-k="back" aria-label="Hapus satu angka">⌫</button>
      </div>
      <p class="status ${ok ? "ok" : ""}" role="status">${status}</p>
    </div>`
};

function render(focus) {
  rail();
  $("stage").innerHTML = V[view]();
  if (focus) { const el = $("stage").querySelector("input, .btn"); el && el.focus(); }
}
function go(v) { clearTimeout(timer); view = v; pin = ""; status = ""; ok = false; loginErr = ""; busy = false; render(true);
  if (v === "done") timer = setTimeout(() => go("pin"), 2200); }

function press(k) {
  status = ""; ok = false; err = false;
  if (k === "clear") pin = ""; else if (k === "back") pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
  render();
  if (pin.length === 4) setTimeout(() => {
    if (pin === "1234") { status = "Halo! Membuka kasir…"; ok = true; }
    else { status = "PIN tidak cocok. Coba lagi."; err = true; }
    pin = ""; render(); err = false;
  }, 200);
}

$("stage").addEventListener("click", e => {
  const el = e.target.closest("[data-a],[data-k]"); if (!el) return;
  if (el.dataset.k !== undefined) return press(el.dataset.k);
  const a = el.dataset.a;
  if (a === "to-login") go("login");
  if (a === "to-start") go("start");
  if (a === "link") { busy = true; render(); setTimeout(() => go("done"), 900); }
});
$("stage").addEventListener("submit", e => {
  e.preventDefault();
  const em = $("em").value.trim(), pw = $("pw").value;
  if (!em || !pw) { loginErr = "Isi email dan kata sandi terlebih dahulu."; render(); return; }
  busy = true; loginErr = ""; render();
  setTimeout(() => go("confirm"), 800);
});
document.addEventListener("keydown", e => {
  if (view !== "pin") return;
  if (/^[0-9]$/.test(e.key)) press(e.key); else if (e.key === "Backspace") press("back");
});
$("reset").addEventListener("click", () => go("start"));
go("start");
</script>
</body>
</html>
